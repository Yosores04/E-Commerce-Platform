<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearing Storage...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #5B2333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✓</h1>
        <p>Storage cleared! Redirecting...</p>
    </div>
    <script>
        // Clear all localStorage
        localStorage.clear();
        
        // Redirect to home page after 1 second
        setTimeout(() => {
            window.location.href = '/';
        }, 1000);
    </script>
</body>
</html>
